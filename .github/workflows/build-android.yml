name: Build Android APK

on:
  workflow_dispatch:   # ← se ejecuta manualmente desde GitHub
  push:
    branches: [ main ] # opcional

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Install dependencies
        run: npm install

      - name: Configure EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas telemetry off
          eas whoami || echo "Expo Auth OK"

      - name: Build APK (LOCAL mode)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --local

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insquiz-apk
          path: ./build/*.apk
